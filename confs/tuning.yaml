job:
  KIND: TuningJob
  inputs:
    KIND: CsvReader
    path: data/processed/inputs_train.csv
  targets:
    KIND: CsvReader
    path: data/processed/targets_train.csv
  model:
    KIND: RandomForest
  splitter:
    KIND: RollingWindowSplitter
    window: 5
    test_size: 1  # match the real deployment task: predict next year, not next 4
    step: 1
  metrics:
    - KIND: SklearnMetric
      name: RMSE
      sklearn_name: root_mean_squared_error
      greater_is_better: false
    - KIND: SklearnMetric
      name: R2
      sklearn_name: r2_score
      greater_is_better: true
  searcher:
    # RandomForest only exposes max_depth/n_estimators (no learning_rate/subsample/
    # colsample_bytree like XGBoost) — small enough grid (16 combos) to search
    # exhaustively rather than sample.
    KIND: GridCVSearcher
    n_jobs: -1
    param_grid:
      max_depth: [10, 15, 20, 25]
      n_estimators: [100, 200, 300, 400]
