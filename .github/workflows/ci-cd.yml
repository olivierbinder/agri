name: CI/CD

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  # 1. Tests — unit tests on the API's critical logic (agri/api/logic.py, agri/api/server.py),
  #    plus lint/type/format as a quality gate. Runs on every push and every PR into main.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: uv sync --no-default-groups --group=check --group=dev
      - run: uv run just check-code
      - run: uv run just check-type
      - run: uv run just check-format
      - run: uv run just check-coverage

  # 2. Build — the API's Docker image, pushed to Docker Hub. Only on pushes to main (not
  #    PRs, not other branches): we don't want half-finished branches published.
  build-and-push:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          push: true
          context: .
          cache-from: type=gha
          cache-to: type=gha
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/agri-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/agri-api:${{ github.sha }}

  # 3. Notify on failure — opens (or updates) a tracking issue with the failed steps' logs
  #    when any job above fails, since there's no chat webhook configured for this project.
  notify-on-failure:
    needs: [test, build-and-push]
    if: always() && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - name: Collect failed step logs
        id: logs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run view "${{ github.run_id }}" --log-failed > failed.log || true
          delimiter="EOF_$(date +%s%N)"
          {
            echo "logs<<$delimiter"
            tail -c 5000 failed.log
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/github-script@v7
        env:
          FAILED_LOGS: ${{ steps.logs.outputs.logs }}
        with:
          script: |
            const title = "CI/CD pipeline failed";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const logs = process.env.FAILED_LOGS || "(no logs captured)";
            const body = [
              `The [CI/CD workflow](${runUrl}) failed on commit ${context.sha}.`,
              "",
              "<details><summary>Failed step logs (last 5000 characters)</summary>",
              "",
              "```",
              logs,
              "```",
              "",
              "</details>",
            ].join("\n");
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "pipeline-failure",
            });
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["pipeline-failure"],
              });
            }
