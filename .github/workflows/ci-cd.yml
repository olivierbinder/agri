name: CI/CD

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  # 1. Tests — unit tests on the API's critical logic (agri/api/logic.py, agri/api/server.py),
  #    plus lint/type/format as a quality gate. Runs on every push and every PR into main.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: uv sync --no-default-groups --group=check --group=dev
      - run: uv run just check-code
      - run: uv run just check-type
      - run: uv run just check-format
      - run: uv run just check-coverage

  # 2. Build — the API's Docker image, pushed to Docker Hub. Only on pushes to main (not
  #    PRs, not other branches): we don't want half-finished branches published.
  build-and-push:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          push: true
          context: .
          cache-from: type=gha
          cache-to: type=gha
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/agri-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/agri-api:${{ github.sha }}
